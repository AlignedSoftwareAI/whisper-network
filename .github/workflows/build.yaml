on:
  push:
    branches:
      - "**"

name: Build

permissions:
  contents: read

env:
  REPO: ${{github.repository}}
  STATICCHECK_VERSION: 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  build:
    name: Run checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test (race detector)
        run: make test-race

      - name: Build
        run: make

  fuzz-smoke:
    name: Fuzz smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Short pass over the hostile-input parsers (see the Makefile for targets
      # and durations).
      - name: Fuzz
        run: make fuzz

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@"${STATICCHECK_VERSION}"
          go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"

      - name: staticcheck
        run: staticcheck ./...

      - name: govulncheck
        run: govulncheck ./...

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    name: Build the docker images (push on default branch)
    # Images are built only from commits that passed every check, so a
    # failing commit can never publish an image.
    needs: [build, fuzz-smoke, lint, format]
    permissions:
      contents: read
      packages: write
    env:
      REF_NAME: ${{ github.ref_name }}
      IS_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Branch builds are tagged br-<sanitized-branch> so they can never collide
      # with release tags (v*, latest, stable). Only the default branch is pushed.
      - name: Compute image names, tag and build arguments
        run: |
          branch="$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-\n' '-' | cut -c1-100)"
          {
            echo "TAG=br-${branch}"
            echo "IMAGE=ghcr.io/${REPO,,}"
            echo "GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')"
            echo "VERSION=$(./utils/version.sh)"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: ${{ env.IS_DEFAULT == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Worker image (default target; also runs `server`): <tag>
      - name: Build worker image (pushed on default branch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: ${{ env.IS_DEFAULT == 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # Minimal distroless server image: <tag>-server
      - name: Build server image (pushed on default branch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: ${{ env.IS_DEFAULT == 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-server
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
