{{define "content"}}
<section class="card narrow">
  <h1>Change password</h1>
  {{if .Data.Forced}}<p class="notice">You must choose a new password before continuing.</p>{{end}}
  {{with .Data.Error}}<p class="error">{{.}}</p>{{end}}
  <form method="post" action="/ui/password" class="stack">
    {{template "csrf" .CSRF}}
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>Repeat new password <input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label>
    <button type="submit">Change password</button>
  </form>
</section>
{{end}}
